---
- name: "Assert required Healthchecks settings"
  ansible.builtin.assert:
    that:
      - "healthchecks_secret_key | length > 0"
      - "healthchecks_admin_password | length > 0"
      - "healthchecks_db_engine in ['postgresql', 'sqlite']"
      - "healthchecks_db_engine != 'postgresql' or healthchecks_db_password | length > 0"
      - >-
        not (healthchecks_assert_os | bool) or
        ansible_os_family == 'Debian' or
        (ansible_os_family == 'RedHat' and ansible_distribution_major_version == '9')
    fail_msg: >-
      Healthchecks needs a non-empty SECRET_KEY, admin password and (for
      PostgreSQL) DB password. This role supports Rocky Linux 9 (Python 3.12
      from AppStream) and Debian 12/13.
    quiet: true

- name: "Install base packages"
  ansible.builtin.package:
    name: "{{ healthchecks_base_packages }}"
    state: "present"
  when: "healthchecks_manage_packages | bool"
  become: "{{ healthchecks_become }}"

- name: "Install the PGDG repository (Rocky 9)"
  ansible.builtin.dnf:
    name: "{{ healthchecks_pgdg_repo_url }}"
    state: "present"
    disable_gpg_check: true
  when:
    - "healthchecks_manage_packages | bool"
    - "healthchecks_manage_database | bool"
    - "healthchecks_db_engine == 'postgresql'"
    - "ansible_os_family == 'RedHat'"
  become: "{{ healthchecks_become }}"

- name: "Disable the distro PostgreSQL module (Rocky 9)"
  ansible.builtin.command:
    cmd: "dnf -qy module disable postgresql"
  when:
    - "healthchecks_manage_packages | bool"
    - "healthchecks_manage_database | bool"
    - "healthchecks_db_engine == 'postgresql'"
    - "ansible_os_family == 'RedHat'"
  changed_when: true
  failed_when: false
  become: "{{ healthchecks_become }}"

- name: "Install PostgreSQL packages"
  ansible.builtin.package:
    name: "{{ healthchecks_postgresql_packages }}"
    state: "present"
  when:
    - "healthchecks_manage_packages | bool"
    - "healthchecks_manage_database | bool"
    - "healthchecks_db_engine == 'postgresql'"
  become: "{{ healthchecks_become }}"

- name: "Initialize the PostgreSQL 16 cluster (Rocky 9)"
  ansible.builtin.command:
    cmd: "/usr/pgsql-{{ healthchecks_postgresql_version }}/bin/postgresql-{{ healthchecks_postgresql_version }}-setup initdb"
    creates: "{{ healthchecks_postgresql_data_dir }}/PG_VERSION"
  when:
    - "healthchecks_manage_database | bool"
    - "healthchecks_db_engine == 'postgresql'"
    - "ansible_os_family == 'RedHat'"
  become: "{{ healthchecks_become }}"

- name: "Ensure PostgreSQL is running"
  ansible.builtin.service:
    name: "{{ healthchecks_postgresql_service }}"
    state: "started"
    enabled: true
  when:
    - "healthchecks_manage_database | bool"
    - "healthchecks_db_engine == 'postgresql'"
  become: "{{ healthchecks_become }}"

- name: "Create the Healthchecks group"
  ansible.builtin.group:
    name: "{{ healthchecks_group }}"
    system: true
    state: "present"
  when: "healthchecks_manage_user | bool"
  become: "{{ healthchecks_become }}"

- name: "Create the Healthchecks user"
  ansible.builtin.user:
    name: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    home: "{{ healthchecks_app_dir }}"
    shell: "/sbin/nologin"
    system: true
    create_home: true
    state: "present"
  when: "healthchecks_manage_user | bool"
  become: "{{ healthchecks_become }}"

- name: "Create the Healthchecks directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "directory"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ healthchecks_app_dir }}", owner: "{{ healthchecks_app_owner }}", group: "{{ healthchecks_app_group }}", mode: "0755"}
    - {path: "{{ healthchecks_python_lib_dir }}", owner: "{{ healthchecks_app_owner }}", group: "{{ healthchecks_app_group }}", mode: "0755"}
    - {path: "{{ healthchecks_config_dir }}", owner: "{{ healthchecks_file_owner }}", group: "{{ healthchecks_file_group }}", mode: "0700"}
    - {path: "{{ healthchecks_sbin_dir }}", owner: "{{ healthchecks_file_owner }}", group: "{{ healthchecks_file_group }}", mode: "0755"}
    - {path: "{{ healthchecks_unit_dir }}", owner: "{{ healthchecks_file_owner }}", group: "{{ healthchecks_file_group }}", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"
  become: "{{ healthchecks_become }}"

- name: "Create the PostgreSQL role"
  community.postgresql.postgresql_user:
    name: "{{ healthchecks_db_user }}"
    password: "{{ healthchecks_db_password }}"
    role_attr_flags: "LOGIN"
    state: "present"
    login_unix_socket: "{{ healthchecks_postgresql_socket }}"
  when:
    - "healthchecks_manage_database | bool"
    - "healthchecks_db_engine == 'postgresql'"
  no_log: true
  become: "{{ healthchecks_become }}"
  become_user: "postgres"

- name: "Create the PostgreSQL database"
  community.postgresql.postgresql_db:
    name: "{{ healthchecks_db_name }}"
    owner: "{{ healthchecks_db_user }}"
    state: "present"
    login_unix_socket: "{{ healthchecks_postgresql_socket }}"
  when:
    - "healthchecks_manage_database | bool"
    - "healthchecks_db_engine == 'postgresql'"
  become: "{{ healthchecks_become }}"
  become_user: "postgres"

- name: "Check out Healthchecks {{ healthchecks_version }}"
  ansible.builtin.git:
    repo: "{{ healthchecks_repo }}"
    dest: "{{ healthchecks_src_dir }}"
    version: "{{ healthchecks_version }}"
    depth: 1
    force: true
  when: "healthchecks_manage_app | bool"
  notify: "Restart Healthchecks"
  become: "{{ healthchecks_become }}"
  become_user: "{{ healthchecks_user }}"

- name: "Install Python dependencies into {{ healthchecks_python_lib_dir }}"
  ansible.builtin.command:
    cmd: >-
      {{ healthchecks_python }} -m pip install --no-cache-dir --upgrade
      --target {{ healthchecks_python_lib_dir }}
      -r {{ healthchecks_src_dir }}/requirements.txt gunicorn
    creates: "{{ healthchecks_python_lib_dir }}/.installed-{{ healthchecks_version }}"
  register: "healthchecks_pip"
  when: "healthchecks_manage_app | bool"
  notify: "Restart Healthchecks"
  become: "{{ healthchecks_become }}"
  become_user: "{{ healthchecks_user }}"

- name: "Mark the dependency install"
  ansible.builtin.copy:
    dest: "{{ healthchecks_python_lib_dir }}/.installed-{{ healthchecks_version }}"
    content: "{{ healthchecks_version }}\n"
    owner: "{{ healthchecks_app_owner }}"
    group: "{{ healthchecks_app_group }}"
    mode: "0644"
  when:
    - "healthchecks_manage_app | bool"
    - "healthchecks_pip is changed"
  become: "{{ healthchecks_become }}"

- name: "Run database migrations"
  ansible.builtin.command:
    cmd: "{{ healthchecks_python }} manage.py migrate --noinput"
    chdir: "{{ healthchecks_src_dir }}"
  environment: "{{ healthchecks_environment }}"
  when: "healthchecks_manage_app | bool"
  changed_when: false
  no_log: true
  become: "{{ healthchecks_become }}"
  become_user: "{{ healthchecks_user }}"

- name: "Collect static files"
  ansible.builtin.command:
    cmd: "{{ healthchecks_python }} manage.py collectstatic --noinput"
    chdir: "{{ healthchecks_src_dir }}"
  environment: "{{ healthchecks_environment }}"
  when: "healthchecks_manage_app | bool"
  changed_when: false
  no_log: true
  become: "{{ healthchecks_become }}"
  become_user: "{{ healthchecks_user }}"

- name: "Compress static assets"
  ansible.builtin.command:
    cmd: "{{ healthchecks_python }} manage.py compress --force"
    chdir: "{{ healthchecks_src_dir }}"
  environment: "{{ healthchecks_environment }}"
  when: "healthchecks_manage_app | bool"
  changed_when: false
  no_log: true
  become: "{{ healthchecks_become }}"
  become_user: "{{ healthchecks_user }}"

- name: "Write the first-admin creation script"
  ansible.builtin.copy:
    dest: "{{ healthchecks_app_dir }}/.create-admin.py"
    mode: "0600"
    owner: "{{ healthchecks_app_owner }}"
    group: "{{ healthchecks_app_group }}"
    content: |
      from django.contrib.auth import get_user_model
      User = get_user_model()
      email = {{ healthchecks_admin_email | to_json }}
      if not User.objects.filter(email=email).exists():
          User.objects.create_superuser(email=email, password={{ healthchecks_admin_password | to_json }})
  when: "healthchecks_manage_app | bool"
  no_log: true
  become: "{{ healthchecks_become }}"

- name: "Create the first admin user"
  ansible.builtin.shell:
    cmd: "{{ healthchecks_python }} manage.py shell < {{ healthchecks_app_dir }}/.create-admin.py"
    chdir: "{{ healthchecks_src_dir }}"
  environment: "{{ healthchecks_environment }}"
  when: "healthchecks_manage_app | bool"
  changed_when: false
  no_log: true
  become: "{{ healthchecks_become }}"
  become_user: "{{ healthchecks_user }}"

- name: "Remove the admin creation script"
  ansible.builtin.file:
    path: "{{ healthchecks_app_dir }}/.create-admin.py"
    state: "absent"
  when: "healthchecks_manage_app | bool"
  no_log: true
  become: "{{ healthchecks_become }}"

- name: "Write the Healthchecks environment file"
  ansible.builtin.template:
    src: "healthchecks.env.j2"
    dest: "{{ healthchecks_env_file }}"
    owner: "{{ healthchecks_file_owner }}"
    group: "{{ healthchecks_file_group }}"
    mode: "0600"
  notify: "Restart Healthchecks"
  no_log: true
  become: "{{ healthchecks_become }}"

- name: "Install the Healthchecks systemd units"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ healthchecks_unit_dir }}/{{ item }}"
    owner: "{{ healthchecks_file_owner }}"
    group: "{{ healthchecks_file_group }}"
    mode: "0644"
  loop:
    - "healthchecks-web.service"
    - "healthchecks-sendalerts.service"
    - "healthchecks-sendreports.service"
    - "healthchecks-prune.service"
    - "healthchecks-prune.timer"
  notify: "Reload systemd"
  become: "{{ healthchecks_become }}"

- name: "Flush handlers before enabling the services"
  ansible.builtin.meta: "flush_handlers"

- name: "Enable and start the Healthchecks services"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: "started"
  loop:
    - "healthchecks-web.service"
    - "healthchecks-sendalerts.service"
    - "healthchecks-sendreports.service"
    - "healthchecks-prune.timer"
  when: "healthchecks_manage_services | bool"
  become: "{{ healthchecks_become }}"
