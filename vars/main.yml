---
# Debian/Ubuntu packages. Python 3.12+ is required by Healthchecks 5.x;
# Debian 13 (trixie) ships 3.13. Use a Debian 12/13 host.
healthchecks_packages:
  - "git"
  - "python3"
  - "python3-venv"
  - "python3-dev"
  - "build-essential"
  - "libpq-dev"
  - "libffi-dev"
  - "libcurl4-openssl-dev"
  - "libssl-dev"
  - "pkg-config"
  - "postgresql"
  - "python3-psycopg2"

healthchecks_environment:
  DEBUG: "False"
  SECRET_KEY: "{{ healthchecks_secret_key }}"
  SITE_ROOT: "{{ healthchecks_site_root }}"
  SITE_NAME: "{{ healthchecks_site_name }}"
  ALLOWED_HOSTS: "{{ healthchecks_allowed_hosts | join(',') }}"
  DB: "{{ healthchecks_db_engine }}"
  DB_NAME: "{{ healthchecks_db_name }}"
  DB_USER: "{{ healthchecks_db_user }}"
  DB_PASSWORD: "{{ healthchecks_db_password }}"
  DB_HOST: "{{ healthchecks_db_host }}"
  DB_PORT: "{{ healthchecks_db_port }}"
  DEFAULT_FROM_EMAIL: "{{ healthchecks_default_from_email }}"
  EMAIL_HOST: "{{ healthchecks_email_host }}"
  EMAIL_PORT: "{{ healthchecks_email_port }}"
  EMAIL_HOST_USER: "{{ healthchecks_email_user }}"
  EMAIL_HOST_PASSWORD: "{{ healthchecks_email_password }}"
  EMAIL_USE_TLS: "{{ healthchecks_email_use_tls | bool | lower }}"
  EMAIL_USE_SSL: "{{ healthchecks_email_use_ssl | bool | lower }}"
  EMAIL_USE_VERIFICATION: "{{ healthchecks_email_use_verification | bool | lower }}"
  REGISTRATION_OPEN: "{{ healthchecks_registration_open | bool | lower }}"
  USE_PAYMENTS: "{{ healthchecks_use_payments | bool | lower }}"
  APPRISE_ENABLED: "{{ healthchecks_apprise_enabled | bool | lower }}"
  PROMETHEUS_ENABLED: "{{ healthchecks_prometheus_enabled | bool | lower }}"
  SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,https"
